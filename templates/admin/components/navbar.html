{% load static %}

<header class="admin-navbar" id="adminNavbar">
    <div class="navbar-left">
        <button type="button" class="navbar-toggle" id="sidebarToggle" aria-label="Toggle sidebar navigation"
            aria-expanded="true" aria-controls="adminSidebar">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
        <h1 class="navbar-page-title">{{ page_title }}</h1>
    </div>

    <div class="navbar-right">
        <div class="navbar-profile">
            <a href="{% url 'admin_pf' %}" class="quick-action-btn border-0 p-3 m-0">
                <!-- IMAGE: Admin profile/avatar -->
                {% if user.profile.profile_image %}

                    <img class="navbar-profile-photo" src="{{ user.profile.profile_image.url }}" alt="{{ user.username }}">

                {% else %}

                    <span class="navbar-profile-default">
                        <i class="fa-solid fa-user"></i>
                    </span>

                {% endif %}
                <span class="profile-name">{{ user.username }}</span>
                
            </a>
        </div>
    </div>
</header>
